# CI: build the Metered API image (Go + Playwright + Chromium — heavy) on
# GitHub's runners and push it to GHCR, so the small OVH box never builds it.
# Runs automatically on push to main; deploy is a separate MANUAL workflow.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/metered-api:latest
            ghcr.io/${{ github.repository_owner }}/metered-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
