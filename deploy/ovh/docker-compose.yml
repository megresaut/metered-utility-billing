# Metered — single-VPS production stack for OVH (or any Docker host).
#
#   Caddy  → auto-TLS, serves the built React frontend + reverse-proxies /api
#   app    → the existing Dockerfile: Go API + in-process scrape worker +
#            scheduler + Python/Playwright/Chromium (one process)
#   db     → self-hosted Postgres 16 with internal TLS and a NON-superuser app
#            role, so RLS (003_rls.sql) actually enforces
#
# Everything is same-origin behind Caddy (https://$DOMAIN), so there is no CORS
# hop in the browser. Secrets come from .env.production (never committed).
#
# Usage: ./deploy.sh   (see README.md). Migrations run automatically on app boot.

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: metered
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?set in .env.production}
      POSTGRES_DB: metered
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/certs:/certs:ro
    # Internal TLS so DATABASE_URL can use sslmode=require (production config
    # rejects sslmode=disable). Self-signed cert generated by bootstrap.sh.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metered -d metered"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  app:
    # CI builds + pushes this image to GHCR; the box `docker compose pull`s it
    # (no building on the box). `build:` stays as a local-dev fallback.
    image: ghcr.io/megresaut/metered-api:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      # App connects as the non-superuser role (RLS enforces). require = encrypt
      # the internal hop without CA verification (self-signed).
      DATABASE_URL: postgres://metered_app:${APP_DB_PASSWORD}@db:5432/metered?sslmode=require
      JWT_SECRET: ${JWT_SECRET:?set in .env.production}
      CRED_MASTER_KEY: ${CRED_MASTER_KEY:?set in .env.production}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set in .env.production}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set in .env.production}
      STORE_ROOT: /data/store
      HANDOFF_DIR: /data/handoff
      PORT: "8090"
    volumes:
      # PDF store + 2FA handoff. A named volume survives restarts; migrating to
      # object storage (R2) is issue #6 (durability across host loss / scaling).
      - appdata:/data
    expose:
      - "8090"
    networks: [internal, web]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../web/dist:/srv:ro          # built frontend (deploy.sh runs the build)
      - caddy_data:/data                # Let's Encrypt certs/state
      - caddy_config:/config
    networks: [web, edge]               # edge = shared with co-hosted apps (Relay)

networks:
  internal:   # db <-> app only, not reachable from Caddy or the host
  web:        # caddy <-> app
  edge:       # shared bridge to co-hosted apps (e.g. Relay's relay-web); created once: docker network create edge
    external: true

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
